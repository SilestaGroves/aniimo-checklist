<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aniimo Checklist</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="titlebar" id="titlebar">
      <div class="hero-art" aria-hidden="true"></div>
      <div class="brand">
        <img class="logo" src="img/logo.webp" alt="Aniimo">
        <span class="brand-tag">Чеклист</span>
      </div>
      <div class="title-actions">
        <button class="icon-btn" id="btn-settings" title="Настройки" aria-label="Настройки">
          <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.54V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.54-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.54V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.54 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.54 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.54 1Z"/></svg>
        </button>
        <button class="icon-btn" id="btn-hide" title="Скрыть" aria-label="Скрыть">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </header>

    <section class="resets">
      <div class="reset">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <div><span class="reset-label">Дейли сброс</span><span class="reset-time" id="reset-daily">—</span></div>
      </div>
      <div class="reset">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <div><span class="reset-label">Викли сброс</span><span class="reset-time" id="reset-weekly">—</span></div>
      </div>
    </section>

    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="daily">Дейли <span class="tab-count" id="count-daily"></span></button>
      <button class="tab" role="tab" data-tab="weekly">Викли <span class="tab-count" id="count-weekly"></span></button>
      <button class="tab" role="tab" data-tab="events">Ивенты <span class="tab-count" id="count-events"></span></button>
      <button class="tab" role="tab" data-tab="weather">Погода <span class="tab-count" id="count-weather"></span></button>
    </nav>

    <div class="update-banner" id="update-banner" hidden></div>

    <main class="content" id="content"></main>

    <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
    <aside class="sheet" id="sheet" hidden></aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
